server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: /mesa/7 (a URL do QR code) e qualquer rota do React precisam cair no index.html.
    # Sem isto, abrir o link direto devolveria 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
}
